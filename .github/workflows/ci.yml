name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13.18"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: pip install -e "./mcp[dev]"
      - name: Lint
        # Exception: script/cascade_creds.py is a standalone, stdlib-only
        # helper outside the lint rules applied to library code.
        run: ruff check . --extend-exclude script/cascade_creds.py
      - name: Type check
        run: mypy mcp/src/
      - name: Test
        run: pytest
