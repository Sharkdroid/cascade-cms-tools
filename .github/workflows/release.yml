name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e "./mcp[dev]"

      # build_release.py's hand-authored skill content (SKILL.md, templates/,
      # scripts/, references/asset_api.md) lives only inside the most recently
      # committed skill bundle zip - skill/cascade-script-writer/ is a
      # gitignored working directory, not tracked source. Seed it from the
      # latest tracked build before re-syncing/validating against whatever
      # cascade-cms-rest version this job just installed.
      - name: Unpack latest release bundle
        run: |
          set -e
          LATEST=$(ls dist/cascade-cms-tools-skill-[0-9]*.zip | sort -V | tail -1)
          echo "Unpacking $LATEST"
          unzip -q "$LATEST" -d /tmp/latest-bundle
          rm -rf skill/cascade-script-writer
          mkdir -p skill
          mv /tmp/latest-bundle/cascade-cms-tools/skill/cascade-script-writer skill/

      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy mcp/src/
      - name: Test
        run: pytest

      # Re-syncs cascade_cms/ from the just-installed cascade-cms-rest and
      # re-validates every template against it - the actual release gate.
      # A template broken by a library API change fails here and blocks the
      # release; fixing it is human/agent judgment work done before
      # re-tagging, same as any other failing CI check (see AGENTS.md).
      - name: Validate release bundle against installed cascade-cms-rest
        run: python build_release.py --no-zip

  release:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The release now attaches only the current tag's skill zip, not the
      # full committed history in dist/ - GitHub Releases ship the skill
      # only; the MCP server is published to PyPI instead (see
      # publish-pypi below).
      - name: Determine skill zip for this tag
        id: zip
        run: |
          set -e
          VERSION="${GITHUB_REF_NAME#v}"
          VERSION_NODOTS="${VERSION//./}"
          FILE="dist/cascade-cms-tools-skill-${VERSION_NODOTS}.zip"
          if [ ! -f "$FILE" ]; then
            echo "::error::Expected $FILE for tag $GITHUB_REF_NAME, not found"
            exit 1
          fi
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.zip.outputs.file }}
          generate_release_notes: true

  publish-pypi:
    needs: validate
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build mcp/ package
        run: |
          pip install build
          python -m build ./mcp
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: mcp/dist
